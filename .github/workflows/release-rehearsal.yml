name: Toolchain release rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  toolchain-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # No registry-url: a rehearsal never publishes, and setup-node would
      # otherwise write `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`,
      # which npm attaches to every request to that registry — sending this
      # job's GitHub token to npm, Inc. with each tarball `npm ci` fetches.
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          package-manager-cache: false
      - run: npm ci
        env:
          # The repository .npmrc resolves this for `//npm.pkg.github.com/`, and
          # npm errors on an unresolvable environment reference, so it is set
          # and empty rather than removed.
          NODE_AUTH_TOKEN: ""
      - run: npm run check
      - name: Create verified rehearsal
        run: npm run release:rehearse -- --output-dir release/toolchain
      - name: Attest packed toolchain
        uses: actions/attest@v4
        with:
          subject-path: release/toolchain/*.tgz
      - name: Upload verified rehearsal
        uses: actions/upload-artifact@v5
        with:
          name: velar-toolchain-${{ github.sha }}
          path: release/toolchain/
          if-no-files-found: error
          retention-days: 14
