name: Toolchain release rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  toolchain-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: npm run check
      - name: Create verified rehearsal
        run: npm run release:rehearse -- --output-dir release/toolchain
      - name: Attest packed toolchain
        uses: actions/attest@v4
        with:
          subject-path: release/toolchain/*.tgz
      - name: Upload verified rehearsal
        uses: actions/upload-artifact@v5
        with:
          name: velar-toolchain-${{ github.sha }}
          path: release/toolchain/
          if-no-files-found: error
          retention-days: 14
