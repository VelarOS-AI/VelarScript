name: Publish npm ecosystem package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Exact independently versioned package name
        required: true
        type: string
      confirm:
        description: Repeat the exact package name to authorize publication
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-ecosystem-publication-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - name: Create the one-package candidate
        env:
          PACKAGE_NAME: ${{ inputs.package }}
        run: node scripts/release-ecosystem.mjs candidate "$PACKAGE_NAME" --output-dir release/ecosystem/candidate
      - name: Publish the verified candidate
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          VELAR_ECOSYSTEM_PUBLISH_CONFIRM: ${{ inputs.confirm }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_SCOPE_TOKEN }}
          NPM_CONFIG_PREFER_ONLINE: "true"
        run: node scripts/publish-ecosystem.mjs release/ecosystem/candidate "$PACKAGE_NAME"
