name: Publish OpenVoxel companion releases

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish to authorize the fixed companion release set
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-openvoxel-companion-publication
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ inputs.confirm == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@v6
        with:
          repository: VelarOS-AI/VelarScript-Libraries
          ref: dd93470638347c0f130feaa105bfeda2b7e0975c
          path: libraries
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify and publish the fixed release set
        working-directory: libraries
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_SCOPE_TOKEN }}
          NPM_CONFIG_PREFER_ONLINE: "true"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "dd93470638347c0f130feaa105bfeda2b7e0975c"

          publish_exact() {
            package_name="$1"
            workspace_name="$2"
            version="$3"
            expected_integrity="$4"
            package_spec="${package_name}@${version}"

            if current_integrity="$(npm view "$package_spec" dist.integrity 2>/dev/null)"; then
              test "$current_integrity" = "$expected_integrity"
            else
              npm publish --workspace "$workspace_name" --tag next --access public --ignore-scripts
            fi

            current_integrity=""
            for attempt in $(seq 1 30); do
              if current_integrity="$(npm view "$package_spec" dist.integrity 2>/dev/null)"; then
                break
              fi
              sleep 5
            done
            test "$current_integrity" = "$expected_integrity"
          }

          publish_exact "@velarscript-labs/database" "@velarscript-labs/database" "0.2.1" "sha512-o46bBk4v/2rN4zkpfX559RLPFhg1eZqTQnoHKJoE4uj8m5KU7UNbErz6zlE/FpcBLrmMAesgphloqLPALpLYFQ=="
          publish_exact "@velarscript-labs/yaml" "@velarscript-labs/yaml" "0.1.1" "sha512-C3fOYiFDbjcFmB3ymAcdOGQhouq+dYWxZdPQCBtRoxP/uDdftBbWk4V0IJKYnONnq9Igd8Tk8I/Pgel6lq/9Jw=="
          publish_exact "@velarscript-labs/msgpack" "@velarscript-labs/msgpack" "0.1.2" "sha512-vR9e0fbFKn/NtHaVjQDgJ6utRrbBZgziCuO+0ZO1kftLX2MpnBWzbn8wPRcMS6CYo7ODhAA3uaIrYNMgDpMkhA=="
          publish_exact "@velarscript-labs/sqlite" "@velarscript-labs/sqlite" "0.2.1" "sha512-CDt/4uA2saEj04VsVa5Wo9/Oatzu/pVYZ9UHO1EH7TXgz745NZOspIo+oK0nkkzrk1aIDadsXX9UmLZCAUHxOQ=="

          npm dist-tag add @velarscript-labs/database@0.2.1 latest
          npm dist-tag add @velarscript-labs/yaml@0.1.1 latest
          npm dist-tag add @velarscript-labs/msgpack@0.1.2 latest
          npm dist-tag add @velarscript-labs/sqlite@0.2.1 latest

          npm dist-tag rm @velarscript-labs/database next || true
          npm dist-tag rm @velarscript-labs/yaml next || true
          npm dist-tag rm @velarscript-labs/msgpack next || true
          npm dist-tag rm @velarscript-labs/sqlite next || true

          test "$(npm view @velarscript-labs/database dist-tags.latest)" = "0.2.1"
          test "$(npm view @velarscript-labs/yaml dist-tags.latest)" = "0.1.1"
          test "$(npm view @velarscript-labs/msgpack dist-tags.latest)" = "0.1.2"
          test "$(npm view @velarscript-labs/sqlite dist-tags.latest)" = "0.2.1"
