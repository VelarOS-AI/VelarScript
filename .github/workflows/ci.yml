name: Velar CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  toolchain:
    name: Toolchain (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      # `npm test` includes Chromium-backed lifecycle and runtime probes. The
      # separate browser matrix expands that coverage to all three engines.
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm run test:packages

  browsers:
    name: Development and production browser matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
