# D101 ruling 6 — the 0.20 freeze point is CI running the complete gate, not
# `check` alone. Every push and pull request now runs the four public gates:
# source quality, the Node suite, packed-consumer acceptance, and the browser
# suite. `test:full` is run rather than `test`, because the full Node suite is
# the quick suite plus every historical `hardening-*` wave, so the gate the
# local `release:check` runs is contained in what CI runs here.
#
# Two gates carry macOS-only coverage and therefore run on both runners:
# `tests/desktop.test.ts` and `tests/package.acceptance.ts` both stop before
# `velar package` on any other platform, because @velarscript/desktop 0.10
# builds only the macOS system-WebView host. Linux proves the single-project
# compiler contract; macOS is the only place the packaged .app, its size
# budget, and the installed toolchain's desktop path are actually produced.
# There is no Windows runner: D101 ruling 7 keeps the Windows and Linux
# desktop hosts as later milestones, and a runner for a target the language
# does not claim yet would gate on nothing.
name: Velar CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: read

# A pull request that receives a second push has no use for the first push's
# six jobs. A commit on main does: every commit there keeps its own verdict.
concurrency:
  group: velar-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Source quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: npm run check

  node-suite:
    # Formatting, documentation, boundaries and types are one platform's job;
    # the Node suite is not. It compiles and runs real programs, and its
    # desktop packaging coverage exists only on macOS.
    name: Node suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      # The Node suite is not browser-free: web-error-paths, browser-lifecycle
      # and module-enum-surface drive a real Chromium, and the historical
      # hardening waves drive several more.
      - name: Cache the locked Playwright browsers
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install the locked Chromium build
        run: npx playwright install chromium
      - name: Install Chromium system dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - name: Read the pinned Desktop runtime version
        if: runner.os == 'macOS'
        id: desktop-runtime
        run: |
          version="$(node --input-type=module -e 'import { DESKTOP_NODE_RUNTIME_VERSION } from "./packages/desktop/src/config.ts"; process.stdout.write(DESKTOP_NODE_RUNTIME_VERSION)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # `velar package` embeds one pinned Node.js runtime, and the first build on
      # a machine downloads its ~50 MiB archive from nodejs.org. The version is
      # read from the one place that pins it rather than written here a second
      # time, so bumping the pin invalidates this key on its own and a runner
      # never restores an executable the toolchain no longer embeds. There are no
      # restore-keys for the same reason: an older cache would be restored and
      # then downloaded past.
      - name: Cache the embedded Desktop Node runtime
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/velarscript/desktop-runtimes
          key: desktop-runtime-${{ runner.os }}-${{ steps.desktop-runtime.outputs.version }}
      - run: npm run test:full

  packed-consumers:
    # `velar package` for a desktop project is reached here only through the
    # installed toolchain, and only on macOS.
    name: Packed consumers
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Read the pinned Desktop runtime version
        if: runner.os == 'macOS'
        id: desktop-runtime
        run: |
          version="$(node --input-type=module -e 'import { DESKTOP_NODE_RUNTIME_VERSION } from "./packages/desktop/src/config.ts"; process.stdout.write(DESKTOP_NODE_RUNTIME_VERSION)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The same runtime the Node suite caches: this gate reaches `velar package`
      # through the installed toolchain, which downloads the identical archive
      # into the identical cache, so the two jobs share one key rather than one
      # of them paying for it every run.
      - name: Cache the embedded Desktop Node runtime
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/velarscript/desktop-runtimes
          key: desktop-runtime-${{ runner.os }}-${{ steps.desktop-runtime.outputs.version }}
      - run: npm run test:packages

  browser-suite:
    # 1x1 by design: the current host and Chromium. The browser gate holds no
    # platform-specific branch, so it is not repeated on macOS.
    name: Browser suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      # Keyed on the lockfile, because the lockfile is what pins the Playwright
      # version whose Chromium revision these gates expect.
      - name: Cache the locked Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install the locked Chromium build
        run: npx playwright install chromium
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - run: npm run test:browser
