name: Velar CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  quality:
    name: Source quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: npm run check
